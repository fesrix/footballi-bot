name: Footballi YouTube Bot & Comment Manager

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_instagram:
        description: "Run Instagram check immediately, ignoring the normal cooldown"
        required: false
        type: boolean
        default: false

concurrency:
  group: footballi-bot-runner
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ARVAN_API_KEY: ${{ secrets.ARVAN_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS }}
      YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      APIFY_FORCE_CHECK: ${{ github.event.inputs.force_instagram == 'true' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Footballi Pipeline (All-in-One Live Log)
        timeout-minutes: 14
        run: |
          echo "=== [1/5] Fast Setup: FFmpeg Static Binary & Python Packages ==="
          if ! command -v ffmpeg &> /dev/null; then
            curl --max-time 25 -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | sudo tar -xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          pip install --quiet --disable-pip-version-check -r requirements.txt
          echo "✅ Setup completed in seconds! FFmpeg: $(which ffmpeg) | Chrome: $(which google-chrome)"

          echo ""
          echo "=== [2/5] Syncing YouTube Analytics ==="
          analytics_status=0
          python -u analytics.py || analytics_status=$?

          echo ""
          echo "=== [3/5] Running Footballi Video Uploader & Queue ==="
          uploader_status=0
          timeout --kill-after=15s 660s stdbuf -oL -eL python -u footballi_uploader.py || uploader_status=$?

          echo ""
          echo "=== [4/5] Running AI Comment Moderator & Responder ==="
          comment_status=0
          timeout --kill-after=10s 120s stdbuf -oL -eL python -u comment_manager.py || comment_status=$?

          echo ""
          echo "=== Growth report ==="
          report_status=0
          python -u growth_report.py || report_status=$?

          echo ""
          echo "=== [5/5] Saving Queue & Channel State ==="
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_matches.json growth_report.md
          push_status=0
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update video queue and indexed matches [skip ci]"
            git pull --rebase origin main || push_status=$?
            if [ "$push_status" -eq 0 ]; then git push || push_status=$?; fi
            if [ "$push_status" -eq 0 ]; then echo "✅ State saved and pushed!"; fi
          else
            echo "ℹ️ No changes to commit."
          fi

          echo "## Footballi run summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Analytics status: $analytics_status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Report status: $report_status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Uploader status: $uploader_status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Comment manager status: $comment_status" >> "$GITHUB_STEP_SUMMARY"
          echo "- State push status: $push_status" >> "$GITHUB_STEP_SUMMARY"
          if [ -f uploaded_matches.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open("uploaded_matches.json", encoding="utf-8") as f:
              state = json.load(f)
          run = state.get("last_run", {})
          analytics = state.get("analytics", {})
          print(f"- Queue size: {run.get('queue_size', 0)}")
          print(f"- New web candidates: {run.get('new_web_candidates', 0)}")
          print(f"- New Instagram candidates: {run.get('new_instagram_candidates', 0)}")
          print(f"- Analytics rows: {analytics.get('last_row_count', 0)}")
          print(f"- Rejections: {run.get('rejected_by_reason', {})}")
          PY
          fi
          if [ "$analytics_status" -ne 0 ] || [ "$report_status" -ne 0 ] || [ "$uploader_status" -ne 0 ] || [ "$comment_status" -ne 0 ] || [ "$push_status" -ne 0 ]; then
            echo "❌ One or more pipeline stages failed." >&2
            exit 1
          fi

