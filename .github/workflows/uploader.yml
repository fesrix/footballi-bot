name: Footballi YouTube Bot & Comment Manager

on:
  schedule:
    - cron: '10,40 * * * *'
  pull_request:
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Set by the external half-hour scheduler"
        type: boolean
        default: false
      force_instagram:
        description: "Check Instagram immediately"
        type: boolean
        default: false
      dry_run:
        description: "Validate code and state without external writes"
        type: boolean
        default: false
      playlists_only:
        description: "Create eligible playlists and organize public videos only"
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'footballi-bot-runner' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install --quiet --disable-pip-version-check -r requirements.txt
          python -m compileall -q .
          if [ -d tests ]; then python -m unittest discover -s tests; fi
          python growth_report.py

  run-bot:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Check half-hour slot
        id: slot
        env:
          AUTOMATIC: ${{ github.event_name == 'schedule' || inputs.scheduled }}
          FORCE_INSTAGRAM: ${{ inputs.force_instagram }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          state = json.loads(Path("uploaded_matches.json").read_text(encoding="utf-8"))
          slot = int(time.time()) // 1800
          automatic = os.getenv("AUTOMATIC") == "true" and os.getenv("FORCE_INSTAGRAM") != "true"
          duplicate = automatic and state.get("last_successful_run_slot") == slot
          dry = os.getenv("DRY_RUN") == "true"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"slot={slot}", file=output)
              print(f"live={str(not (duplicate or dry)).lower()}", file=output)
          if duplicate and not dry:
              print("This half-hour slot was already completed.")
          PY

      - name: Install dependencies
        id: setup
        if: steps.slot.outputs.live == 'true' || inputs.dry_run
        timeout-minutes: 3
        run: |
          pip install --quiet --disable-pip-version-check -r requirements.txt
          if [ "${{ steps.slot.outputs.live }}" = true ] && ! command -v ffmpeg > /dev/null; then
            curl --fail --max-time 25 -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | sudo tar -xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi

      - name: Validate without publishing
        if: inputs.dry_run
        run: |
          python -m compileall -q .
          if [ -d tests ]; then python -m unittest discover -s tests; fi
          python growth_report.py
          python footballi_uploader.py --audit-originals-queue

      - name: Sync YouTube Analytics
        id: analytics
        if: steps.slot.outputs.live == 'true' && !inputs.playlists_only
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: timeout --kill-after=5s 90s python -u analytics.py

      - name: Process video queue
        id: uploader
        if: ${{ !cancelled() && steps.slot.outputs.live == 'true' && steps.setup.outcome == 'success' && !inputs.playlists_only }}
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARVAN_API_KEY: ${{ secrets.ARVAN_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS }}
          APIFY_FORCE_CHECK: ${{ inputs.force_instagram == true }}
          FOOTBALLI_PROGRAMME_HOLD: ${{ vars.FOOTBALLI_PROGRAMME_HOLD }}
          FOOTBALLI_ORIGINALS_ONLY: ${{ vars.FOOTBALLI_ORIGINALS_ONLY }}
        run: timeout --kill-after=5s 595s python -u footballi_uploader.py

      - name: Review YouTube comments
        id: comments
        if: ${{ !cancelled() && steps.slot.outputs.live == 'true' && steps.setup.outcome == 'success' && !inputs.playlists_only }}
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARVAN_API_KEY: ${{ secrets.ARVAN_API_KEY }}
        run: timeout --kill-after=5s 235s python -u comment_manager.py

      - name: Curate public playlists
        if: steps.slot.outputs.live == 'true' && inputs.playlists_only
        timeout-minutes: 5
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: python -u footballi_uploader.py --playlists-only

      - name: Write run report
        id: report
        if: ${{ always() && steps.slot.outputs.live == 'true' && steps.setup.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          python growth_report.py
          cat growth_report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n## Stage outcomes\n- Analytics: %s\n- Comments: %s\n- Publishing: %s\n' \
            '${{ steps.analytics.outcome }}' '${{ steps.comments.outcome }}' '${{ steps.uploader.outcome }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Save state on main
        id: save
        if: ${{ always() && steps.slot.outputs.live == 'true' }}
        timeout-minutes: 1
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
          PIPELINE_OK: ${{ steps.analytics.outcome == 'success' && steps.comments.outcome == 'success' && steps.uploader.outcome == 'success' && steps.report.outcome == 'success' }}
        run: |
          cp uploaded_matches.json "$RUNNER_TEMP/footballi-recovery.json"
          if [ "$PIPELINE_OK" = true ]; then
            python - <<'PY'
          from footballi_uploader import load_state, save_state
          import os
          state = load_state()
          state["last_successful_run_slot"] = int(os.environ["SLOT"])
          save_state(state)
          PY
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- uploaded_matches.json
          if [ -f growth_report.md ]; then git add -- growth_report.md; fi
          if ! git diff --cached --quiet; then
            git commit -m "Save Footballi bot state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Keep state for recovery if saving failed
        if: ${{ always() && steps.save.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: footballi-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/footballi-recovery.json
          retention-days: 3
