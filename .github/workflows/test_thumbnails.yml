name: Test Single AI Thumbnail

on:
  workflow_dispatch:
    inputs:
      video_url_or_id:
        description: 'لینک ویدیو یا شناسه یوتیوب (Video URL or ID)'
        required: true
        default: 'https://youtu.be/--vp7qA9TVw'
      official_source:
        description: "Repair the thumbnail from the original Footballi page (provide the YouTube video ID)"
        type: boolean
        default: false

jobs:
  update_thumbnail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --quiet --disable-pip-version-check -r requirements.txt
          if [ "${{ inputs.official_source }}" = true ] && ! command -v ffmpeg >/dev/null; then
            curl --fail --max-time 25 -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | sudo tar -xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg'
          fi

      - name: Run Single Thumbnail Generator
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          ARVAN_API_KEY: ${{ secrets.ARVAN_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_VIDEO: ${{ inputs.video_url_or_id }}
          OFFICIAL_SOURCE: ${{ inputs.official_source }}
        run: |
          if [ "$OFFICIAL_SOURCE" = true ]; then
            python footballi_uploader.py --repair-official-thumbnail "$TARGET_VIDEO"
          else
            python generate_thumbnails_batch.py
          fi
