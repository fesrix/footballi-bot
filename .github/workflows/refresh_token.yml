name: YouTube OAuth renewal instructions

on: workflow_dispatch

permissions:
  contents: read

jobs:
  instructions:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Show local renewal instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Renew **YOUTUBE_TOKEN** with a Google Desktop OAuth client using the
          [local instructions](https://github.com/fesrix/footballi-bot/blob/main/README.md#renew-youtube-access).
          Authorization codes and tokens should stay out of workflow inputs and logs.
          EOF
