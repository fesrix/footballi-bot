name: Recover Short audio

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID of an authorized Instagram Short already uploaded by Footballi"
        required: true
        type: string
      stage_upload:
        description: "Stage a verified replacement on YouTube as unlisted"
        default: false
        type: boolean
      picture_url:
        description: "Optional public Instagram CDN picture track from the same official post"
        type: string
      audio_url:
        description: "Optional public Instagram CDN sound track from the same official post"
        type: string

permissions:
  contents: read

concurrency:
  group: footballi-bot-runner
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet --disable-pip-version-check -r requirements.txt 'yt-dlp==2026.10.26'
      - name: Prepare FFmpeg and FFprobe
        run: |
          if ! command -v ffmpeg > /dev/null || ! command -v ffprobe > /dev/null; then
            curl --fail --max-time 45 -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | sudo tar -xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - run: python -m unittest discover -s tests -p test_short_audio.py
      - name: Verify and rebuild original sound
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          RECOVER_VIDEO_ID: ${{ inputs.video_id }}
          STAGE_UPLOAD: ${{ inputs.stage_upload }}
          FOOTBALLI_PROGRAMME_HOLD: ${{ vars.FOOTBALLI_PROGRAMME_HOLD }}
        run: python -u prepare_short_recovery.py
